<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-mail confirmado — Finlu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #0F172A; color: #F1F5F9;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1E293B; border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px; padding: 3rem 2rem;
      max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .icon-wrap {
      width: 72px; height: 72px;
      background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.25);
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-bottom: .75rem; color: #fff; }
    p { font-size: 15px; color: #94A3B8; line-height: 1.7; margin-bottom: 0; }
    
    /* Animaçãozinha suave no check */
    .success-check { stroke-dasharray: 100; animation: draw 0.8s ease-out forwards; }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="success-check" d="M12 25l10 10 16-20" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>E-mail confirmado!</h1>
    <p>
      Sua conta no Finlu foi ativada com sucesso.<br><br>
      Você já pode fechar esta página e voltar para o aplicativo no seu dispositivo para fazer o login.
    </p>
  </div>
</body>
</html>
